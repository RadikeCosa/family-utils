name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Git reference to verify completely
        required: true
        type: string
        default: main

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: family
          POSTGRES_PASSWORD: family
          POSTGRES_DB: family_utils
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U family -d family_utils"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://family:family@localhost:5432/family_utils
      DATABASE_URL_UNPOOLED: postgres://family:family@localhost:5432/family_utils
      FAMILY_UTILS_TEST_DATABASE_URL: postgres://family:family@localhost:5432/family_utils
      BETTER_AUTH_SECRET: ci-only-secret-not-used-outside-ci
      BETTER_AUTH_URL: http://localhost:3000
      CODE_PEPPER: ci-only-pepper-not-used-outside-ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
          cache: npm
      - run: npm ci
      - name: Verify catalogue and select impact
        id: scope
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p verification-results
          HEAD_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git rev-parse origin/main)"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if node scripts/verification-impact.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --output verification-results/selection.json; then SELECTOR_STATUS=0; else SELECTOR_STATUS=$?; fi
          else
            if node scripts/verification-impact.mjs --full --base "$MAIN_SHA" --head "$HEAD_SHA" --output verification-results/selection.json; then SELECTOR_STATUS=0; else SELECTOR_STATUS=$?; fi
          fi
          test -s verification-results/selection.json
          cp verification-results/selection.json "$RUNNER_TEMP/selection.json"
          node -e 'const s=require(process.argv[1]);require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY,`## Alcance de CI\n\n- Modo: ${s.mode}\n- Base: ${s.base}\n- Candidato: ${s.head}\n- Grupos: ${s.groups.join(", ")||"documentación"}\n- Motivos: ${s.reasons.join("; ")}\n`)' "$RUNNER_TEMP/selection.json"
          if [ "$SELECTOR_STATUS" -ne 0 ]; then exit "$SELECTOR_STATUS"; fi
      - name: Check documentation links
        if: steps.scope.outputs.mode == 'documentation'
        run: |
          git diff --check "${{ github.event.pull_request.base.sha || github.event.before }}" --
          node scripts/check-documentation.mjs verification-results/selection.json
      - name: Check dependency and migration metadata
        if: steps.scope.outputs.mode != 'documentation'
        run: |
          npm ls --depth=0
          npm run db:check
          npx drizzle-kit check
          npm run db:migrate
          npm run db:verify
      - name: Check SQL permissions
        if: steps.scope.outputs.mode == 'full'
        run: psql "$DATABASE_URL_UNPOOLED" -X -v ON_ERROR_STOP=1 -f sources/champions/permisos-check.sql
      - name: Lint, types and production build
        if: steps.scope.outputs.mode != 'documentation'
        run: |
          npm run lint
          npm run typecheck
          npm run build
      - name: Install browser dependencies
        if: steps.scope.outputs.browser == 'true'
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium webkit
      - name: Create isolated UI database
        if: steps.scope.outputs.shared_ui == 'true'
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c 'CREATE DATABASE family_unified_test'
      - name: Migrate isolated UI database
        if: steps.scope.outputs.shared_ui == 'true'
        run: npm run db:migrate
        env:
          DATABASE_URL: postgres://family:family@localhost:5432/family_unified_test
          DATABASE_URL_UNPOOLED: postgres://family:family@localhost:5432/family_unified_test
      - name: Run selected suites sequentially
        if: steps.scope.outputs.mode != 'documentation'
        env:
          FAMILY_UTILS_UNIFIED_DATABASE_URL: postgres://family:family@localhost:5432/family_unified_test
        run: node scripts/run-verification-suites.mjs --selection "$RUNNER_TEMP/selection.json"
      - name: Upload browser evidence
        if: always() && steps.scope.outputs.browser == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification-${{ github.run_id }}
          path: |
            test-results/**/*.png
            test-results-a11y/**/*.png
            test-results-unified/**/*.png
            test-results-unified/performance.json
            test-results-training-diary/**/*.png
          if-no-files-found: warn
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence-${{ github.run_id }}
          path: verification-results/
          if-no-files-found: warn
      - name: Require a valid verification catalogue
        if: always() && steps.scope.outcome == 'failure'
        run: |
          echo "::error::El catálogo/selector falló; la suite completa se ejecutó, pero CI no puede aprobar hasta corregirlo."
          exit 1
