name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: family
          POSTGRES_PASSWORD: family
          POSTGRES_DB: family_utils
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U family -d family_utils"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://family:family@localhost:5432/family_utils
      DATABASE_URL_UNPOOLED: postgres://family:family@localhost:5432/family_utils
      BETTER_AUTH_SECRET: ci-only-secret-not-used-outside-ci
      BETTER_AUTH_URL: http://localhost:3000
      CODE_PEPPER: ci-only-pepper-not-used-outside-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
