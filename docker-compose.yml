services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: family
      POSTGRES_PASSWORD: family
      POSTGRES_DB: family_utils
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family -d family_utils"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - family_utils_postgres:/var/lib/postgresql/data

volumes:
  family_utils_postgres:
